# Painel do EX5 Insights. Copie tudo e cole em Configurações > Painéis > (novo painel) > ⋮ > Editor de configuração bruta.
title: EX5
views:
  - type: sections
    title: Geely EX5
    path: ex5
    icon: "mdi:car-electric"
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Carro
            icon: "mdi:car-electric"
          - type: "custom:ex5-car-card"
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: "Onde está"
            icon: "mdi:map-marker"
          - type: "custom:ex5-map-card"
            grid_options:
              columns: full
              rows: 5
  - type: sections
    title: Uso
    path: uso
    icon: "mdi:chart-box-outline"
    max_columns: 2
    header:
      card:
        type: markdown
        text_only: true
        content: "# Uso do carro"
    sections:
      - type: grid
        cards:
          - type: heading
            heading: "Mês"
            icon: "mdi:calendar-month"
          - type: tile
            entity: select.ex5_month
            name: "Mês"
            icon: "mdi:calendar-month"
            color: blue
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: select-options
            grid_options:
              columns: full
          - type: tile
            entity: sensor.ex5_month_distance
            name: Km
            icon: "mdi:map-marker-distance"
            color: blue
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_month_charges
            name: Recargas
            icon: "mdi:ev-station"
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_month_energy
            name: kWh
            icon: "mdi:lightning-bolt"
            color: amber
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_month_cost
            name: Custo
            icon: "mdi:cash"
            color: red
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_month_consumption
            name: Consumo
            icon: "mdi:speedometer"
            color: purple
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_month_cost_per_km
            name: Custo por km
            icon: "mdi:cash-marker"
            color: grey
            grid_options:
              columns: 6
          - type: conditional
            conditions:
              - condition: state
                entity: number.ex5_pending_cost
                state_not: unavailable
            card:
              type: entities
              title: Recarga esperando o valor pago
              entities:
                - entity: number.ex5_pending_cost
                  name: Valor pago
          - type: conditional
            conditions:
              - condition: state
                entity: number.ex5_pending_station_kwh
                state_not: unavailable
            card:
              type: entities
              title: Recarga esperando os kWh do eletroposto
              entities:
                - entity: number.ex5_pending_station_kwh
                  name: kWh do eletroposto
          - type: "custom:ex5-heading"
            heading: "Recargas do mês"
            icon: "mdi:ev-station"
            space_above: 24
          - type: markdown
            grid_options:
              columns: full
            content: "{% set e = 'sensor.ex5_month_table' %}{% set rs = state_attr(e, 'rows') or [] %}{% set t = state_attr(e, 'total') or {} %}{% if rs | count == 0 %}Nenhuma recarga em {{ state_attr(e, 'month_label') }}.{% else %}\n<table width=\"100%\">\n<tr><th align=\"left\">Dia</th><th align=\"left\">Hora</th><th align=\"right\">kWh</th><th align=\"right\">R$/kWh</th><th align=\"right\">Total R$</th></tr>\n{% for x in rs %}<tr><td>{{ x.day }}</td><td>{{ x.time or '—' }}</td><td align=\"right\">{{ x.kwh }}</td><td align=\"right\">{{ 'a informar' if x.pending else ('—' if x.free else x.price) }}</td><td align=\"right\">{{ 'a informar' if x.pending else ('grátis' if x.free else x.total) }}</td></tr>\n{% endfor %}<tr><td colspan=\"2\"><b>Total</b></td><td align=\"right\"><b>{{ t.kwh }}</b></td><td align=\"right\"><b>{{ t.price or '—' }}</b></td><td align=\"right\"><b>{{ t.total }}</b></td></tr>\n</table>{% if t.pending | default(0) > 0 %}\n\n<small>{{ t.pending }} recarga(s) com valor ainda a informar, fora do total.</small>{% endif %}{% endif %}"
      - type: grid
        cards:
          - type: heading
            heading: "Por mês"
            icon: "mdi:chart-bar"
          - type: statistics-graph
            title: Km
            chart_type: bar
            period: month
            days_to_show: 365
            stat_types:
              - change
            hide_legend: true
            entities:
              - entity: sensor.ex5_odometer
                name: Km
            grid_options:
              columns: full
          - type: statistics-graph
            title: kWh carregados
            chart_type: bar
            period: month
            days_to_show: 365
            stat_types:
              - change
            entities:
              - entity: "ex5_insights:energy_ac"
                name: AC
              - entity: "ex5_insights:energy_dc"
                name: DC
            grid_options:
              columns: full
  - type: sections
    title: Autonomia
    path: autonomia
    icon: "mdi:map-marker-distance"
    max_columns: 2
    header:
      card:
        type: markdown
        text_only: true
        content: "# Autonomia"
    sections:
      - type: grid
        cards:
          - type: "custom:ex5-heading"
            heading: "Carga Cheia (100%)"
            icon: "mdi:battery"
            icon_color: "var(--green-color)"
          - type: tile
            entity: sensor.ex5_real_range_highway
            name: Estrada
            icon: "mdi:highway"
            color: blue
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_real_range_city
            name: Cidade
            icon: "mdi:city-variant-outline"
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_real_range
            name: Geral
            icon: "mdi:map-marker-distance"
            color: purple
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_car_range_full
            name: Pelo carro
            icon: "mdi:car-info"
            color: grey
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: "custom:ex5-heading"
            heading: "Carga Atual ({battery}%)"
            icon: "mdi:battery-50"
          - type: tile
            entity: sensor.ex5_range_now_highway
            name: Estrada
            icon: "mdi:highway"
            color: blue
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_range_now_city
            name: Cidade
            icon: "mdi:city-variant-outline"
            color: green
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_range_now
            name: Geral
            icon: "mdi:map-marker-distance"
            color: purple
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_car_range
            name: Pelo carro
            icon: "mdi:car-info"
            color: grey
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: Bateria
            icon: "mdi:car-battery"
          - type: tile
            entity: sensor.ex5_battery_health
            name: "Saúde"
            icon: "mdi:battery-heart"
            color: red
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.ex5_battery_capacity
            name: "Capacidade Máx."
            icon: "mdi:battery-high"
            color: amber
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: Ao longo do tempo
            icon: "mdi:chart-line"
          - type: statistics-graph
            title: Autonomia
            chart_type: line
            period: week
            days_to_show: 365
            stat_types:
              - mean
            hide_legend: false
            grid_options:
              columns: full
            entities:
              - entity: sensor.ex5_real_range_highway
                name: Estrada
              - entity: sensor.ex5_real_range_city
                name: Cidade
              - entity: sensor.ex5_real_range
                name: Geral
          - type: statistics-graph
            title: "Saúde da bateria"
            chart_type: line
            period: month
            days_to_show: 1095
            stat_types:
              - mean
            grid_options:
              columns: full
            entities:
              - entity: sensor.ex5_battery_health
                name: "Saúde"
  - type: sections
    title: Timeline
    path: viagens
    icon: "mdi:map"
    max_columns: 2
    header:
      card:
        type: markdown
        text_only: true
        content: "# Timeline"
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Rastro do dia
            icon: "mdi:map-marker-path"
          - type: "custom:ex5-timeline-card"
            height: 420
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Viagens
            icon: "mdi:calendar-month"
          - type: calendar
            entities:
              - calendar.ex5_trips
            initial_view: listWeek
            grid_options:
              columns: full
          - type: heading
            heading: "Viagens do mês"
            icon: "mdi:format-list-bulleted"
            heading_style: subtitle
          - type: tile
            entity: select.ex5_month
            name: "Mês"
            icon: "mdi:calendar-month"
            color: blue
            hide_state: true
            vertical: false
            features_position: inline
            features:
              - type: select-options
            grid_options:
              columns: full
          - type: markdown
            grid_options:
              columns: full
            content: "{% set e = 'sensor.ex5_month_trips' %}{% set vs = state_attr(e, 'trips') or [] %}{% set days = ['seg.', 'ter.', 'qua.', 'qui.', 'sex.', 'sáb.', 'dom.'] %}{% if vs | count == 0 %}Nenhuma viagem registrada em {{ (state_attr(e, 'month_label') or '') | lower }}.{% else %}{% set ns = namespace(day='') %}{% for x in vs %}{% if x.day != ns.day %}{% set ns.day = x.day %}{% set d = as_datetime(x.day) %}\n\n**{{ days[d.weekday()] }} {{ d.strftime('%d/%m') }}**\n{% endif %}\n{{ x.time }} · {{ x.summary }}{% if x.map %} · [mapa]({{ x.map }}){% endif %}  {% endfor %}{% endif %}"
